name: Options Scanner and Website Deploy

on:
  schedule:
    # GitHub cron uses UTC (03:00-10:59 UTC = 08:30-16:29 IST). After hours the site shows the last session.
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run market scanner
        run: python scanner.py

      - name: Build site folder
        if: always()
        run: |
          mkdir -p _site
          cp index.html _site/
          cp live_data.json _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload website
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        if: always()
        uses: actions/deploy-pages@v5
