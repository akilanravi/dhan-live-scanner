name: Options Scanner and Website Deploy

on:
  schedule:
    # UTC. Live scan every 5 min (08:30-16:25 IST); evening CPR scan at 16:30 IST.
    - cron: "*/5 3-10 * * 1-5"
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "live = signals only, evening = signals + next-day CPR scan of all F&O"
        type: choice
        options: [evening, live]
        default: evening

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: python -m pip install --upgrade pip -r requirements.txt

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Decide mode
        run: |
          if [ "${{ github.event.schedule }}" = "30 11 * * 1-5" ]; then MODE=evening
          elif [ -n "${{ github.event.schedule }}" ]; then MODE=live
          else MODE="${{ github.event.inputs.mode }}"; fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"

      - name: Restore the last evening CPR file (also holds the top-100 volume list)
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/cpr_nextday.json" -o cpr_nextday.json || echo "no previous CPR file yet"

      - name: Live scan (indices + signals)
        run: python scanner.py
        continue-on-error: true

      - name: Evening CPR scan (all F&O stocks)
        if: env.MODE == 'evening'
        run: python cpr_nextday.py
        continue-on-error: true

      - name: Build site folder
        run: |
          mkdir -p _site
          cp index.html live_data.json _site/
          [ -f cpr_nextday.json ] && cp cpr_nextday.json _site/ || true
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
